[pyprland]
plugins = ["scratchpads", "workspaces_follow_focus"]

[scratchpads.gptbing]
command = "flatpak run com.microsoft.Edge --app='https://www.bing.com/search?form=NTPCHB&q=Bing+AI&showconv=1'"
animation = "fromTop"
multi = "false"
# match_by = "title"
match_by = "class"
# title = "Copilot with GPT-4"
# title = "Microsoft Copilot in Bing"
class = "Microsoft-edge"
margin = 70
position = "20% 50px"
size = "60% 60%"
lazy = true

[scratchpads.up-term]
command = "kitty --class dropterm-top"
animation = "fromTop"
unfocus = "hide"
position = "25% 45px"
margin = 100
size = "50% 50%"
lazy = true

[scratchpads.drop-term]
command = "kitty --class dropterm yazi"
animation = "fromBottom"
unfocus = "hide"
position = "25% 48%"
size = "50% 50%"
lazy = true

[scratchpads.music]
command = "kitty --class music --title ncspot -e tmux new-session -A -s ncspot ncspot"
animation = "fromTop"
unfocus = "hide"
position = "25% 45px"
size = "50% 65%"
lazy = true

# [scratchpads.telegramchrome]
# command = "chromium class=whatsapp --app=https://web.telegram.org/a/"
# position = "25% 20%"
# size = "50% 60%"
# lazy = true
# excludes = ["telegram"]

[scratchpads.whatsapp]
command = "flatpak run com.rtosta.zapzap"
position = "20% 10%"
size = "60% 80%"
lazy = true
class = "com.rtosta.zapzap"
unfocus = "hide"
process_tracking = false
animation = "fromTop"
margin = 200


[scratchpads.steam]
command = "flatpak run com.valvesoftware.Steam"
position = "20% 10%"
size = "60% 80%"
lazy = true
class = "steam"
unfocus = "hide"
process_tracking = false
animation = "fromRight"
margin = 750


[scratchpads.volume]
command = "pavucontrol"
animation = "fromRight"
lazy = true
size = "15% 25%"

[scratchpads.discord]
command = "vesktop"
position = "20% 10%"
size = "60% 80%"
animation = "fromRight"
match_by = "class"
class = "vesktop"
margin = 1000
lazy = true
unfocus = "hide"
process_tracking = false
